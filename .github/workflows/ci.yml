name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, with the release in a
# comment; Dependabot (github-actions) proposes the updates.

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two LTS lines enterprises run. engines.node is >=22.6.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      # The turn-level suites run every case on both runtimes in each run
      # (tests/helpers/runtime.ts). native is the default runtime (ADR 0102);
      # the second run puts every other suite on adk, which stays covered
      # until 1.0.0 removes it.
      - name: offline test suite (no network, no keys)
        run: npm test
      - name: offline test suite with adk as the runtime
        env:
          MELCHIZEDEK_RUNTIME: adk
        run: npm test
      - name: stored session shapes are unchanged
        run: npm run fixtures:sessions:check
      # The parity suites compare native against ADK's recorded side
      # (tests/fixtures/adk-reference, tests/helpers/adkReference.ts). The
      # check runs them again against live ADK, records into a scratch
      # directory and fails on any byte of drift. 1.0.0 (WS5-2b) retires it
      # with ADK; the recordings stay as the reference.
      - name: ADK reference recordings are current
        run: npm run fixtures:adk:check
      - name: coverage of lib/ (floor a few points under the measured 87.8 / 82.1 / 83.2)
        if: matrix.node == '24'
        run: >-
          node --disable-warning=DEP0040 --disable-warning=ExperimentalWarning --experimental-strip-types
          --experimental-test-coverage --test-coverage-include='lib/**'
          --test-coverage-lines=85 --test-coverage-branches=78 --test-coverage-functions=80
          --test 'tests/**/*.test.ts'
      - name: build the package
        run: npm run build
      # The tarball is consumed twice (ADR 0102): without @google/adk, the
      # optional peer, a turn of a shipped example runs on native, the
      # default; with it, the same turn runs on adk. The model is a scripted
      # adapter behind the ADK shim, and fetch refuses every call, so
      # nothing leaves the runner. The turn script is the repository's own
      # (scripts/ci/consumer_turn.mjs), copied next to the consumer.
      - name: pack the tarball
        run: |
          set -euo pipefail
          npm pack --silent
          echo "TARBALL=$PWD/$(ls melchizedek-agents-*.tgz)" >> "$GITHUB_ENV"
          echo "ADK_PIN=$(node -p "require('./package.json').devDependencies['@google/adk']")" >> "$GITHUB_ENV"
      - name: consume the tarball without @google/adk (native, the default)
        env:
          EXPECT_RUNTIME: native
          EXPECT_ADK: 'no'
        run: |
          set -euo pipefail
          CONSUMER="$(mktemp -d)"
          cp scripts/ci/consumer_turn.mjs "$CONSUMER/"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TARBALL"
          if [ -e node_modules/@google/adk ]; then echo "@google/adk was installed, but it is an optional peer"; exit 1; fi
          mkdir -p config/agents
          cp node_modules/melchizedek-agents/config/agents/examples/tutor.yaml config/agents/
          node consumer_turn.mjs
          if MELCHIZEDEK_RUNTIME=adk node consumer_turn.mjs > adk.log 2>&1; then echo "adk ran without @google/adk"; exit 1; fi
          grep -q 'needs @google/adk, which is not installed' adk.log
          npx melchizedek-doctor --no-color | grep -E '^runtime +✓ native \(the default\) · @google/adk not installed'
          npx melchizedek-db print | head -1
      - name: consume the tarball with @google/adk (MELCHIZEDEK_RUNTIME=adk)
        env:
          EXPECT_RUNTIME: adk
          EXPECT_ADK: 'yes'
          MELCHIZEDEK_RUNTIME: adk
        run: |
          set -euo pipefail
          CONSUMER="$(mktemp -d)"
          cp scripts/ci/consumer_turn.mjs "$CONSUMER/"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TARBALL" "@google/adk@$ADK_PIN"
          mkdir -p config/agents
          cp node_modules/melchizedek-agents/config/agents/examples/tutor.yaml config/agents/
          node consumer_turn.mjs
          npx melchizedek-doctor --no-color | grep -E '^runtime +✓ adk \(MELCHIZEDEK_RUNTIME\) · @google/adk [0-9.]+ installed'

  postgres:
    name: storage integration (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pg17, pinned by digest (Dependabot proposes updates).
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: the Supabase API roles hardening.sql revokes from
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
      - name: migrations, telemetry and hardening apply, and re-apply cleanly
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          npm run db -- apply --telemetry
          npm run db -- apply --telemetry
      - name: storage integration suite (creates and drops its own database)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node --disable-warning=DEP0040 --experimental-strip-types --test tests/postgresStorage.test.ts
      - name: storage integration suite with adk as the runtime
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MELCHIZEDEK_RUNTIME: adk
        run: node --disable-warning=DEP0040 --experimental-strip-types --test tests/postgresStorage.test.ts
      # The test job's reference check skips this suite (no database there).
      - name: the storage suite's ADK reference recording is current
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run fixtures:adk:check -- postgresStorage

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: production dependencies have no high or critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: registry signatures verify
        run: npm ci && npm audit signatures
