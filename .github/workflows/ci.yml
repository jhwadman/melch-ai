name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, with the release in a
# comment; Dependabot (github-actions) proposes the updates.

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two LTS lines enterprises run. engines.node is >=22.6.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      # One runtime, one run (ADR 0107). The parity suites compare the
      # engine against ADK's recorded side (tests/fixtures/adk-reference),
      # and the ADK-written session fixtures (tests/fixtures/sessions)
      # resume: both are data, read by the suite itself.
      - name: offline test suite (no network, no keys)
        run: npm test
      - name: coverage of lib/ (floor a few points under the measured 87.8 / 82.1 / 83.2)
        if: matrix.node == '24'
        run: >-
          node --disable-warning=DEP0040 --disable-warning=ExperimentalWarning --experimental-strip-types
          --experimental-test-coverage --test-coverage-include='lib/**'
          --test-coverage-lines=85 --test-coverage-branches=78 --test-coverage-functions=80
          --test 'tests/**/*.test.ts'
      - name: build the package
        run: npm run build
      # The tarball is installed alone into an empty project (ADR 0107): no
      # Google ADK may arrive with it. The consumer runs a turn of a shipped
      # example and serves one A2A message, with a scripted ModelAdapter
      # and fetch refusing every call, so nothing leaves the runner, and
      # checks that MELCHIZEDEK_RUNTIME=adk is refused by name. The script
      # is the repository's own (scripts/ci/consumer_turn.mjs), copied next
      # to the consumer.
      - name: pack the tarball
        run: |
          set -euo pipefail
          npm pack --silent
          echo "TARBALL=$PWD/$(ls melchizedek-agents-*.tgz)" >> "$GITHUB_ENV"
      - name: consume the tarball (no ADK installed)
        run: |
          set -euo pipefail
          CONSUMER="$(mktemp -d)"
          cp scripts/ci/consumer_turn.mjs "$CONSUMER/"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TARBALL"
          if [ -e node_modules/@google/adk ]; then echo "@google/adk was installed with the package"; exit 1; fi
          mkdir -p config/agents
          cp node_modules/melchizedek-agents/config/agents/examples/tutor.yaml config/agents/
          node consumer_turn.mjs
          if MELCHIZEDEK_RUNTIME=adk npx melchizedek-doctor --check --no-color > doctor-adk.log 2>&1; then echo "the doctor passed MELCHIZEDEK_RUNTIME=adk"; exit 1; fi
          grep -q 'removed in melchizedek-agents 1.0.0' doctor-adk.log
          npx melchizedek-doctor --no-color | grep -E '^runtime +✓ native \(the default\)'
          npx melchizedek-db print | head -1

  postgres:
    name: storage integration (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pg17, pinned by digest (Dependabot proposes updates).
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: the Supabase API roles hardening.sql revokes from
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
      - name: migrations, telemetry and hardening apply, and re-apply cleanly
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          npm run db -- apply --telemetry
          npm run db -- apply --telemetry
      - name: storage integration suite (creates and drops its own database)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node --disable-warning=DEP0040 --experimental-strip-types --test tests/postgresStorage.test.ts

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: production dependencies have no high or critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: registry signatures verify
        run: npm ci && npm audit signatures
