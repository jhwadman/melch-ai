name: release

# Publishing is a maintainer's act: it starts only when a maintainer pushes
# a version tag (git tag v0.18.0 && git push origin v0.18.0). The workflow
# then proves the tag matches package.json, runs the gates, builds from an
# empty dist/, publishes with npm provenance through trusted publishing
# (OIDC: no npm token is stored anywhere), and attaches a CycloneDX SBOM to
# the GitHub Release. A version already on npm (a laptop publish) is not
# published again: the tag then only creates the Release and its SBOM.
# One-time setup on npmjs.com: package settings →
# Trusted publisher → GitHub Actions, repository jhwadman/melch-ai,
# workflow release.yml, environment npm.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write   # the GitHub Release and its SBOM
      id-token: write   # npm trusted publishing and the provenance statement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: trusted publishing needs npm 11.5 or newer
        run: npm install -g npm@^11.5.1
      - name: the tag names the version in package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "tag v$TAG does not match package.json $PKG"; exit 1; fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: build from an empty dist/ (nothing stale can ship)
        run: rm -rf dist && npm run build
      - name: SBOM (CycloneDX) of what the package depends on
        run: npm sbom --sbom-format cyclonedx --omit dev > "melchizedek-agents-${GITHUB_REF_NAME}.cdx.json"
      - name: publish with provenance (skipped when this version is already on npm)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "melchizedek-agents@${VERSION}" version >/dev/null 2>&1; then
            echo "melchizedek-agents@${VERSION} is already on npm (published by hand); creating the GitHub Release only."
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      - name: GitHub Release with the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## " v " " {f=1; next} /^## [0-9]/ {if (f) exit} f' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" "melchizedek-agents-${GITHUB_REF_NAME}.cdx.json" \
            --title "melchizedek-agents $VERSION" --notes-file release-notes.md --verify-tag
