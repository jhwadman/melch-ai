version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A dependency PR must pass CI (both Node lines) before it is merged.
    # @google/adk and @google/genai are pinned exact on purpose: bump them
    # deliberately, after a live run (see the model-routing skill).
    groups:
      opentelemetry:
        patterns: ['@opentelemetry/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
