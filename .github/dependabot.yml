version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A dependency PR must pass CI (both Node lines) before it is merged.
    # @google/genai is pinned exact on purpose: bump it deliberately, after
    # a live run (see the model-routing skill).
    groups:
      opentelemetry:
        patterns: ['@opentelemetry/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Container images are pinned by digest (Dockerfile, compose.yaml, the CI
  # service): these propose the new digest when an image moves.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
