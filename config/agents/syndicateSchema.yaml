# yaml-language-server: $schema=./syndicate.schema.json
# ============================================================
# Melchizedek Syndicate Schema Reference
# ============================================================
#
# This file documents ALL available properties for a syndicate
# YAML definition, in the v2 spelling (ADR 0115): what an agent asks of
# its model is said in provider-neutral keys (sampling, output,
# reasoning, model_overrides). The other agent fields keep the spelling
# of their Google ADK counterparts (LlmAgent).
#
# Runtime (ADR 0107): the engine's own agent loop (the NATIVE runtime)
# runs every key below; 1.0.0 removed Google ADK, and nothing here
# needs it. A "Maps to:" line names the ADK field a key is spelled
# after: a spelling, not something ADK builds.
#
# It is an annotated EXAMPLE. The enforced contract is
# lib/syndicateSchema.ts: every load validates against it and a
# misspelt or unknown key fails with its path and the key it was
# probably meant to be. Its JSON Schema, config/agents/
# syndicate.schema.json (npm run schema:gen), is what the modeline
# above points an editor at — add the same line to your own file.
#
# Where the spellings come from (a reference, not a dependency):
#   LlmAgentConfig      → Google ADK 2.2 :: agents/llm_agent.d.ts
#   BaseAgentConfig     → Google ADK 2.2 :: agents/base_agent.d.ts
#
# Legend:
#   [required]  Must be provided
#   [optional]  Can be omitted
#   ⚠           Note or constraint the engine enforces (most were
#               ADK's first)
# ============================================================

# ── Syndicate metadata ──────────────────────────────────────

# [required] Display name for this syndicate.
syndicate_name: "My Syndicate"

# [optional] Template variable defaults.
# Use {{token}} syntax anywhere in this file to reference them.
# Override at runtime via bindings in the initializing script
# or via --bind / --bindings CLI flags.
# Built-in: {{current_date}} always resolves to today's date
# (America/New_York, e.g. "July 7, 2026") via loadSyndicate's default
# bindings. Do NOT hardcode a current_date here — a stale value silently
# poisons date-anchored prompts (e.g. Google Search recency anchors).
# [optional] Post-answer guards by NAME (lib/guards/index.ts), run by the A2A
# server on the answering turn's final text with that turn's tool results,
# before the reply is published. Unknown names are warned and skipped.
# guards: [science]

variables:
  my_variable: "default_value"

# [optional] Self-correction, ON by default: the engine's reflect-and-retry,
# ported from ADK's plugins (ADR 0034, ADR 0075). model_errors: retries of a model
# reply the engine marks malformed (default 2). tool_errors: retries of a tool that threw, with
# reflection guidance to the model (default 3). 0 turns either off. Every
# retry is a model call under max_steps.
# retries:
#   model_errors: 2
#   tool_errors: 3

# [optional] Subagent calls the orchestrator's model makes in ONE step that
# run at once (ADR 0116). The rest wait their turn and start in call order;
# two calls to the same subagent run one after the other on its session.
# Their results are stored in call order whatever order they finish in.
# Default 4, at most 32; 1 runs them one after another. A delegate
# syndicate only: a workflow bounds its nodes with workflow.max_concurrency,
# and a dispatch classifier delegates nothing. A nested syndicate's
# orchestrator runs under its own file's value.
# max_concurrency: 4

# [optional] Domain rules appended to the shared fact-extraction prompt for
# THIS syndicate only (requires memory_system: "long-term").
#
# The extraction prompt is global — every long-term consumer runs the same
# one — so anything domain-specific belongs here, not edited into it. Unset,
# the prompt renders exactly as it did before this field existed.
#
# Use it to say what is worth remembering in your domain. A financial desk
# stores what the user holds and the levels they set, never a market quote
# (it re-fetches those live, and a stored quote only crowds the shortlist);
# a clinical assistant would want the opposite.
memory_extraction_rules: |
  NEVER store: <values that go stale on their own>
  ALWAYS store: <what the user asserted, decided, or committed to>

# [optional] The model that distils this syndicate's turns into memory
# records. Default: the deployment's MEMORY_EXTRACTION_MODEL. A cheaper model
# for a chatty desk, a stronger one where a missed fact costs more.
memory_extraction_model: "gemini-3.8-flash"

# [optional] Days a fact in this syndicate's namespace is kept; older facts
# are deleted once a day by the server. Needs memory_namespace: retention
# never applies to the shared default namespace.
# memory_retention_days: 365

# [optional] Switches this syndicate from DELEGATE to PLAN-DISPATCH.
#
#   DELEGATE (omit this block, the default): each subagent is a tool on the
#   orchestrator (lib/runtime/native/delegate.ts), which calls one and then
#   RE-EMITS its answer to close
#   the turn. Classification is implicit in which tool it calls.
#
#   PLAN-DISPATCH (declare it): the orchestrator holds NO subagent tools and
#   instead carries an `output.schema` naming one route. Code reads that name,
#   runs the matching subagent, and returns THAT agent's output as the answer.
#   No relay turn, one fewer LLM call, and the hand-off is a value in code —
#   so it can be logged, traced, and streamed to a waiting user as
#   "[STATUS] Routed to <Name> — <reason>".
#
# ⚠ The orchestrator is a leaf in this mode: it gets no subagent tools on
#   any provider: the engine compiles it with no subagent tools, because an
#   agent that holds an output schema answers in that JSON and nothing else
#   (see examples/critic.yaml).
#   Pair the schema with output.mime: "application/json".
# Every surface runs it the same way: the A2A server and
# scripts/syndicate_chat.ts both run turns through runSyndicateTurn.
#
# Contract and fail-static rules: lib/dispatch.ts. Worked examples:
# examples/research.yaml, templates/support_triage.yaml.
dispatch:
  # [required] Subagent used whenever routing yields no usable answer —
  # malformed JSON, an unknown name, or a classifier that failed outright.
  # Must name a declared subagent that can handle ANY message: routing is an
  # optimisation, answering the user is the contract.
  default_route: "MySubagent"
  # [optional] JSON property holding the chosen route. Default "route".
  route_key: "route"
  # [optional] Deterministic pre-classification: a message matching `pattern`
  # is pinned to `route` and the classifier never runs. First match wins.
  # For facts the message CONTAINS — a URL only one specialist can open, an
  # explicit demand for a named tool — never for topic guesses: an override
  # cannot be reasoned around by the classifier, so a keyword encoded here
  # silently disables the routes it shadows. A rule naming an undeclared
  # subagent or carrying an invalid regex is skipped with a warning.
  route_overrides:
    - route: "MySubagent"
      pattern: "(?:https?://)?example\\.com/"   # JS regex source
      flags: "i"                               # [optional] default "i"
      reason: "shown to the waiting user as the [STATUS] route note"
  # [optional] JSON property holding the short justification shown to the
  # waiting user as progress. Default "reason".
  reason_key: "reason"

# [optional] Switches this syndicate to a WORKFLOW: the agents below are
# the nodes of a graph, and `edges` says what runs after what. Nothing
# delegates, nothing classifies; the orchestrator is a node like any
# other. Cannot be combined with `dispatch`. Contract: lib/workflow.ts
# (the block's types and checks) and lib/workflow/ (the engine's own
# scheduler, which walks the graph); worked example:
# examples/pipeline.yaml (ADR 0030).
#
#   - A chain is a list. `START` opens at least one chain. A name is an
#     agent or a declared node; a list of names fans out (after one
#     node) or fans in (before one node); a map
#     `{ <route>: <node or nodes>, default: <node> }` ends a chain and
#     routes on the output of the node before it (`route_key` of a JSON
#     output, else the trimmed text).
#   - Every node receives the previous node's output as its message and,
#     unless its YAML sets includeContents, sees nothing else.
#   - `ask_user` pauses the turn (input-required); the next message is
#     the answer, and the node outputs { reply, input }.
#   - require_approval, and skills.scripts: local (each script run), on a
#     node's agent pause that node, and the walk, until a person decides
#     (ADR 0098, ADR 0106); neither is allowed on an agent a map runs. a2a_agent_url is
#     not supported inside a workflow yet.
#   - A yaml_reference to a workflow syndicate runs its whole graph as the
#     node, on its own session (ADR 0106).
#   - A route may lead back to an earlier node (a loop). max_steps bounds
#     the model calls in it; a turn also starts at
#     most 20 × max_steps node runs (at least 100), so a loop of tool nodes
#     that never stops routing back fails the turn NODE_RUN_LIMIT
#     (ADR 0105). Raise max_steps to raise it.
# workflow:
#   edges:
#     - [START, OrchestratorName, { article: [MySubagent, Other], default: Other }]
#     - [[MySubagent, Other], Both, Review, Confirm]
#   nodes:
#     OrchestratorName: { route_key: "kind" }      # an agent: modifiers only
#     Both:    { join: true }                      # waits for every predecessor
#     Each:    { map: "MySubagent", max_parallel: 4 }   # one run per list item
#     Lookup:  { tool: "web_extract" }             # a registry tool as a node
#     Review:  { retry: { max_attempts: 2, initial_delay: 1 }, timeout: 120 }
#     # retry also takes max_delay, backoff_factor, jitter (0 = none) and
#     # exceptions: [NodeTimeoutError] (retry only on these error names).
#     # A map node takes neither retry nor timeout: set them on its agent.
#     Confirm: { ask_user: "Publish? Reply yes, or say what to change." }
#   max_concurrency: 4

# ── Orchestrator ────────────────────────────────────────────
# The turn's root agent: the engine's agent loop runs it. Its keys are
# spelled after ADK's LlmAgentConfig.

orchestrator:

  # ── BaseAgentConfig fields ──────────────────────────────

  # [required] Unique identifier. Must be a valid JS identifier.
  # Must be unique within the agent tree. Cannot be "user".
  name: "OrchestratorName"

  # [optional] One-line description of what this agent does.
  # Used by peer/parent agents to decide whether to delegate here.
  description: "Lead orchestrator of the syndicate."

  # ── LlmAgentConfig fields ───────────────────────────────

  # [required] The model to use. The id's prefix names the provider and the
  # framework routes accordingly (lib/models/registry.ts):
  #   gemini-*  → Google Gemini (GEMINI_API_KEY; the engine's adapter)
  #   claude-*  → Anthropic     (ANTHROPIC_API_KEY)
  #   gpt-* /o* → OpenAI        (OPENAI_API_KEY)
  #   grok-*    → xAI           (XAI_API_KEY)
  #   kimi-*    → Moonshot Kimi (MOONSHOT_API_KEY)
  #   ollama/*  → local Ollama  (keyless)
  # Subagents inherit this if not set on their own config.
  model: "gemini-3.5-flash-lite"

  # [optional] A model that answers when `model` fails provider-side (5xx,
  # 429, a connection reset) before producing anything, or while that
  # provider's circuit is open (MODEL_BREAKER_THRESHOLD, ADR 0044). Put it
  # on another provider. A 4xx is never redirected.
  # fallback_model: "claude-haiku-4-5"

  # [required] The agent's system prompt / persona.
  # Maps to: instruction
  instruction: |
    You are the lead orchestrator.
    Call upon your subagents to fulfill the user's request.

  # [optional] Global instruction applied to ALL agents in the tree.
  # Only the root agent's globalInstruction takes effect.
  # Use to enforce a shared identity or safety rules across the tree.
  # Maps to: globalInstruction
  globalInstruction: |
    Always respond in English. Never reveal internal tool names.

  # [optional] Named built-in tools to attach to this agent.
  # Maps to: tools[] on LlmAgent
  # Supported values include "web_search" (provider-agnostic: maps to the
  # model's NATIVE search on Gemini/Claude/GPT/Grok, omitted with a warning
  # on local models) and "google_search" (Gemini-only, legacy).
  # Full registry: lib/toolRegistry.ts.
  tools: []

  # [optional] MCP server to discover tools from at RUNTIME, and the
  # server's tools this agent may use (mcp_tools). Same keys, same rules
  # as on a subagent (see below): a one-agent syndicate reaches an MCP
  # server here. require_approval may name an MCP tool listed in mcp_tools.
  # mcp_server_url: "http://localhost:8931/sse"
  # mcp_tools: [wiki_search, wiki_read]

  # [optional] Agent Skills this agent holds the way a coding harness does
  # (lib/tools/skillToolset.ts; worked example: examples/harness.yaml).
  # `dir` is a directory of skills in the open SKILL.md standard: one
  # subdirectory per skill, named as its frontmatter names it, holding
  # SKILL.md and optionally references/, assets/ and scripts/. Relative to
  # the working directory; a `{{variable}}` works here.
  # Every skill's name and description is appended to the instruction at
  # compile time (no turn is spent listing them); the agent gains
  # `load_skill` (one SKILL.md in full, with the names of its files) and
  # `load_skill_resource` (one of those files).
  # `scripts`: "none" (default) or "local". With "local" the agent also
  # gains `run_skill_script`, which runs a script from a skill's scripts/
  # on THIS machine, each run only after a person approves it (the same
  # pause as require_approval, ADR 0028), so it is allowed only on the
  # orchestrator or a plan-dispatch route. The model's own code never runs.
  # `tools`: registry names a skill may unlock through its `allowed-tools`
  # frontmatter once it is loaded; a name already in `tools:` above is an
  # error (it is always on). Omitted, a skill unlocks nothing.
  # `env`: with "local", environment variable NAMES (never values) a script
  # gets. A script starts from PATH, HOME/USERPROFILE, the temp directory,
  # the locale (LANG, LC_*) and the Windows essentials, never the server's
  # whole environment, so a provider key, DATABASE_URL or a bearer secret
  # does not reach it. A name that looks like a secret (KEY, TOKEN, SECRET,
  # PASSWORD, AUTH, DATABASE, ...) is refused here; list it under
  # `secret_env` to pass it deliberately (ADR 0086). A script's stdout and
  # stderr are each cut at 20,000 characters, with a line saying so.
  # Maps to: tools[] (a toolset) and instruction (the appended index)

  # [optional] Few-shot exchanges the engine adds to every request's
  # instruction (lib/tools/examples.ts), in the block ADK's ExampleTool
  # wrote; the model never calls it.
  # Up to 20.
  # examples:
  #   - input: "Is it going to rain in Lyon tomorrow?"
  #     output: "Yes: 4 mm expected between 14:00 and 18:00."

  # [optional] "gemini": the model writes Python and Gemini runs it in
  # Google's server-side sandbox; nothing runs on this host. Gemini only.
  # code_execution: "gemini"

  # [optional] Summarize a long conversation instead of overflowing the
  # window: past `compact_after_tokens` (the last request's prompt), earlier
  # turns become one summary and the last `keep_recent_events` stay
  # verbatim. The full history stays stored. Orchestrator of a delegate
  # syndicate only (ADR 0033).
  # context:
  #   compact_after_tokens: 60000
  #   keep_recent_events: 6
  #   summary_model: "gemini-3.5-flash-lite"   # default: this agent's model

  # [optional] "task" on a WORKFLOW NODE: the agent works with its tools
  # until it calls finish_task; its arguments (matching output.schema) are
  # the node's output.
  # mode: "task"

  # [optional] HTTP APIs as tools, each from an OpenAPI 3 spec FILE
  # (.yaml/.yml/.json, relative to this syndicate file; never a URL).
  # One tool per operation, named from its operationId in snake_case.
  # Without `operations`, only GET operations become tools; a named
  # operation can be listed under require_approval. `auth` names an
  # environment variable, never a value. Every server passes the SSRF
  # guard (ALLOW_PRIVATE_OPENAPI=true for local development).
  # lib/tools/openapiTools.ts; worked example: examples/weather.yaml.
  # openapi:
  #   - spec: "specs/my-api.json"
  #     operations: [listOrders, createOrder]   # default: the GET operations
  #     auth: { bearer_env: "MY_API_TOKEN" }    # or api_key: { env, in, name }
  #     base_url: "https://api.example.com/v2"  # overrides servers[0].url
  #     prefix: "shop"                          # shop_list_orders, ...
  #   # or an OAuth 2 token per call (ADR 0112): each user's own
  #   # (authorization_code: a user who has not granted it is asked, through
  #   # the consent pause) or the server's own (client_credentials). Client
  #   # ids and secrets are environment variable NAMES, never values.
  #   - spec: "specs/tracker.yaml"
  #     auth:
  #       oauth2:
  #         provider: "tracker"                   # the credential store's name
  #         grant: "authorization_code"           # or client_credentials
  #         authorization_url: "https://tracker.example.com/oauth/authorize"
  #         token_url: "https://tracker.example.com/oauth/token"
  #         client_id_env: "TRACKER_CLIENT_ID"    # or client_id: "<the id>"
  #         client_secret_env: "TRACKER_CLIENT_SECRET"
  #         scopes: ["issues:read"]
  # skills:
  #   dir: ".claude/skills"
  #   scripts: "local"
  #   tools: ["web_extract"]
  #   env: ["MY_TOOL_HOME"]          # names only; scripts get nothing else
  #   secret_env: ["MY_API_TOKEN"]   # a credential, passed on purpose

  # [optional] Whether to include conversation history in model requests.
  # "default" → include history (stateful)
  # "none"    → no history (stateless / pure function)
  # Maps to: includeContents
  includeContents: "default"

  # [optional] Prevents the LLM from handing control back to the parent agent.
  # ⚠ Also prevents this agent from replying to the end-user directly.
  # Maps to: disallowTransferToParent
  disallowTransferToParent: false

  # [optional] Prevents the LLM from handing control to peer agents.
  # Maps to: disallowTransferToPeers
  disallowTransferToPeers: false

  # [optional] Saves the agent's final text reply to session state
  # under this key. Useful for chaining agents via shared state.
  # Maps to: outputKey
  outputKey: "orchestrator_output"

  # ── reasoning ─────────────────────────────────────────────
  # [optional] How hard the agent reasons, on any provider (ADR 0047):
  #   none | low | medium | high | xhigh | max, or { budget_tokens: <int> }.
  # The compiler sends each provider the field it reads:
  #   gemini-3 and later    → thinkingConfig.thinkingLevel
  #                           (none = MINIMAL, then LOW, MEDIUM, HIGH)
  #   gemini-2.x, claude-* 4.6 and earlier
  #                         → thinkingConfig.thinkingBudget
  #                           (none 0, low 2048, medium 8192, high 16384)
  #   later claude-*        → reasoningEffort, sent as adaptive thinking at
  #                           that effort; none is the model's off switch,
  #                           or low effort on Opus 5 and 5.5, Fable and
  #                           Mythos (ADR 0049)
  #   gpt-*/o*, grok-*, kimi-*, ollama/*, a gateway
  #                         → reasoningEffort (an effort word; where the
  #                           provider lacks one, its nearest setting above)
  # A budget is sent as-is to Gemini and to Claude 4.6 and earlier, and as
  # the smallest level that covers it everywhere else. Unset, each provider
  # keeps its default.
  # xhigh and max (ADR 0117) reach the models that take them: both on later
  # claude-*, max on kimi-k3 (xhigh rounds up to it), xhigh on gpt-5.2 and
  # later and grok-4.7. Elsewhere the model's highest setting is sent and
  # the span carries llm.reasoning.weakened; a gateway gets high.
  # Cannot be combined with generateContentConfig.thinkingConfig or
  # generateContentConfig.reasoningEffort, its deprecated v1 spelling.
  reasoning: medium

  # ── sampling ──────────────────────────────────────────────
  # [optional] How the model samples, on any provider (ADR 0115). Exactly
  # the fields the engine sends to every provider; each adapter sends the
  # ones its API takes.
  sampling:

    # Sampling temperature. Lower = more deterministic. Range: [0.0, 2.0]
    # ⚠ Do NOT set this on current Gemini models — they are tuned for their
    #   own default sampling and the knob is not part of their contract.
    #   Set it only for claude-*, gpt-*, grok-*, kimi-*, or ollama/* agents.
    # temperature: 0.7

    # Nucleus sampling. Tokens sampled until cumulative prob = top_p.
    top_p: 0.95

    # Maximum tokens the model may generate in one response.
    max_output_tokens: 2048

    # Stop generation if any of these strings are encountered.
    # stop: ["END"]

  # ── output ────────────────────────────────────────────────
  # [optional] What the agent answers in (ADR 0115).
  #   schema: a JSON Schema; the agent ends its turn on one JSON object
  #           matching it. Beside tools or subagents it calls them first
  #           (ADR 0109).
  #   mime:   "application/json" (JSON mode, with or without a schema) or
  #           "text/plain" (the default).
  output:
    mime: "text/plain"
    # schema:
    #   type: object
    #   properties:
    #     answer: { type: string }
    #   required: [answer]

  # ── tool_choice ───────────────────────────────────────────
  # [optional] Which tools the model may call, on any provider (ADR 0117):
  #   auto (the default) | none | required (some tool)
  #   | { name: <tool> } (that one tool).
  # A provider that rejects forcing a tool gets a weaker choice, and the
  # span carries llm.tool_choice.weakened.
  # tool_choice: auto

  # ── model_overrides ───────────────────────────────────────
  # [optional] A prompt nuance for one provider (ADR 0115). Keys are the
  # providers a model id routes to: gemini, anthropic, openai, xai,
  # moonshot, ollama. Each holds ONE of:
  #   instruction:         replaces the instruction on that provider
  #   instruction_append:  added after the instruction, after a blank line
  # Applied for the provider of this agent's model, before the skills
  # index; a fallback_model gets the same instruction.
  # model_overrides:
  #   ollama:
  #     instruction_append: "Answer in at most three sentences."

  # ── generateContentConfig (deprecated) ───────────────────
  # The v1 spelling: @google/genai's GenerateContentConfig, with
  # outputSchema beside it. Still loads and behaves as before, with one
  # deprecation line per file; `npx melchizedek-codemod <file>` rewrites
  # it into sampling, output, reasoning and tool_choice. A v2 key beside
  # its v1 spelling is a load error. Only toolConfig's VALIDATED mode and
  # Gemini's dynamic budget (thinkingBudget: -1) have no v2 form. topK,
  # seed, the penalties, candidateCount, safetySettings and
  # includeThoughts reach no provider.

# ── Subagents ───────────────────────────────────────────────
# Each entry is an agent the orchestrator calls as a tool (DELEGATE),
# a route (dispatch) or a node (workflow); the engine's agent loop runs it.
# Its keys are spelled after ADK's LlmAgentConfig; under DELEGATE the
# engine lists it in the orchestrator's tools (lib/runtime/native/delegate.ts).

subagents:

  - # ── BaseAgentConfig fields ──────────────────────────────

    # [required] Unique name. Must be a valid JS identifier.
    name: "MySubagent"

    # [required] One-line description.
    # The orchestrator LLM reads this to decide when to call this subagent.
    description: "Handles a specific domain task."

    # ── LlmAgentConfig fields ───────────────────────────────

    # [alternative] A whole nested syndicate as this subagent: a
    # filename resolved like any other (root, then examples/, then
    # templates/). It brings its own model and instruction, so neither
    # is needed here. Cannot be combined with a2a_agent_url.
    # yaml_reference: "research_desk.yaml"

    # [alternative] A REMOTE agent over the A2A protocol: the server's
    # base URL (its card is read from /.well-known/agent-card.json) or
    # the card URL itself. Needs no model or instruction. Credentials
    # come from A2A_AGENT_TOKENS (host → bearer), never from YAML.
    # a2a_agent_url: "https://agents.example.com"

    # [optional] Override the model for this subagent.
    # If omitted, inherits the orchestrator's model.
    model: "gemini-3.5-flash-lite"

    # [required unless yaml_reference / a2a_agent_url] System prompt.
    # Maps to: instruction
    instruction: |
      You are a specialist subagent. Complete the task passed to you
      and return a structured summary to the orchestrator.

    # [optional] Named built-in tools for this subagent.
    # Maps to: tools[] on LlmAgent
    # Supported values include "web_search" (provider-agnostic),
    # "google_search" (Gemini-only, legacy),
    # and the knowledge-bundle tools "wiki_map", "wiki_search",
    # "wiki_read", "wiki_links", "wiki_dive", "wiki_save"
    # (lib/toolRegistry.ts is the authoritative name→tool map).
    tools:
      - "web_search"

    # [optional] MCP server to discover tools from at RUNTIME.
    # Maps to: nothing on LlmAgent directly — the framework dials
    # this URL (SSE), asks tools/list, and wraps each remote tool
    # as a live agent tool (lib/tools/mcpToolFactory.ts). Merges
    # with the declared tools above; declared names win on
    # collision. An unreachable server degrades to an empty tool
    # list with a console warning. Loopback/private hosts are
    # refused unless ALLOW_PRIVATE_MCP=true (local development).
    # See config/agents/librarian.yaml for the worked example.
    # mcp_server_url: "http://localhost:8931/sse"

    # [optional] The MCP server's tools this agent may use, by name. Any
    # other tool the server lists is not exposed (a server's list is its
    # own to change). Without it, every listed tool is. On a dispatch
    # route (and on the orchestrator), require_approval may name these
    # (ADR 0041). Descriptions are
    # cut at 1,000 characters and results at 20,000.
    # mcp_tools: [wiki_search, wiki_read]

    # [optional] The OAuth 2 grant the MCP server takes (ADR 0112), the same
    # `oauth2` block as an OpenAPI `auth`. client_credentials: the server's
    # own token on every request. authorization_code: each user's own token
    # on their own connection; a user who has not granted it is asked
    # (the consent pause, which only the orchestrator or a dispatch route
    # can raise), and mcp_tools is required, since no grant exists at
    # startup to list the server's tools. Replaces MCP_BEARER_TOKENS for
    # this server. `npm run doctor` lists every tool that needs a grant.
    # mcp_auth:
    #   oauth2:
    #     provider: "systems"
    #     grant: "client_credentials"
    #     token_url: "https://auth.example.com/oauth/token"
    #     client_id_env: "SYSTEMS_CLIENT_ID"
    #     client_secret_env: "SYSTEMS_CLIENT_SECRET"
    #     scopes: ["orders:read"]

    # [optional] Agent Skills for this subagent; same block as on the
    # orchestrator. `scripts: "local"` is allowed here only under
    # `dispatch:` (a delegated subagent cannot pause the turn, ADR 0028).
    # skills:
    #   dir: ".claude/skills"

    # [optional] Stateless operation — subagent sees no history.
    # Maps to: includeContents
    includeContents: "none"

    # [optional] Store this subagent's output in session state.
    # Maps to: outputKey
    outputKey: "subagent_result"

    # [optional] Same key as on the orchestrator.
    reasoning: none             # As little thinking as the model allows, for speed

    # ── sampling / output / model_overrides ─────────────────
    # Same keys as on the orchestrator above. Only set what you need.

    sampling:
      max_output_tokens: 1024
